<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="../css/customer.css"/>
</head>
<body>
    <h2>Products List</h2>
    <button id="newProductBtn">New Product</button>
    <button id="logoutBtn">Logout</button>

    <table id="productsTable" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Codigo</th>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Costo</th>
                <th>Precio</th>
                <th>Stock minimo</th>
                <th>Descontinuado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Formulario para agregar / editar producto -->

<div id="productForm" style="display:none">
    <h3 id="formTitle">Nuevo Producto</h3>
    <form id="form">
        <input type="hidden" id = "productID">
        <input type="text" id="productCode" placeholder="Codigo"><br>
        <input type="text" id="productName" placeholder="Nombre" required><br>
        <input type="text" id="category" placeholder="Categoria"><br>
        <input type="text" id="quantityPerUnit" placeholder="Cantidad por unidad"><br>
        <input type="number" step="0.01" id="standarCost" placeholder="Costo" required><br>
        <input type="number" step="0.01" id="listPrice" placeholder="Precio de lista" required><br>
        <input type="number" id="reorderLevel" placeholder="Nivel de reorden"><br>
        <input type="number" id="targetLevel" placeholder="Nivel objetivo"><br>
        <input type="number" id="minimumReorderQuantity" placeholder="Cantidad minima de reorden"><br>
        <textarea id="descripcion" placeholder="descripcion"></textarea><br>
        <label><input type="checkbox" id="discontinued">Descontinuado</label><br>
        <button type="submit">Guardar</button>
        <button type="button" onclick="document.getElementById('productForm').style.display='none'">Cancelar</button>

    </form>
</div>

<script type="module" src="../js/views/product.js"></script>

</body>
</html>
